
services:
  app:
    build:
      context: ./docker/php
    container_name: zavod_app
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
    networks:
      - laravel_net

  webserver:
    image: nginx:alpine
    container_name: zavod_webserver
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "${NGINX_PORT}:80"
    depends_on:
      - app
    networks:
      - laravel_net

  db:
    image: postgres:13
    container_name: zavod_db
    environment:
      POSTGRES_DB: zavod
      POSTGRES_USER: zavod
      POSTGRES_PASSWORD: zavod
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${PGSQL_PORT}:5432"
    networks:
      - laravel_net

volumes:
  db_data:

networks:
  laravel_net:
